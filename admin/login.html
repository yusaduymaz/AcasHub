<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Login - AcasHub Admin</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/logo-symbol.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <img src="../assets/images/logo-symbol.png" alt="AcasHub" width="48" height="48">
                <h1>Acas<span>Hub</span></h1>
                <p>Admin Panel</p>
            </div>
            <form id="loginForm" class="login-form" novalidate>
                <div class="form-field">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="admin@acashub.com" required autocomplete="email">
                </div>
                <div class="form-field">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error" role="alert"></div>
                <button type="submit" id="loginBtn" class="btn-login">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
            <a href="../index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to website</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../assets/js/supabase.js"></script>
    <script src="assets/js/login.js"></script>
</body>
</html>
